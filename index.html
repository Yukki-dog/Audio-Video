
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video to Audio Converter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #efebf0;
    color: #705375;
    font-family: "Segoe UI", sans-serif;
}

.container {
    width: 100%;
    max-width: 490px;
    padding: 35px;
    background: white;
    border-radius: 24px;
    box-shadow: 0 8px 30px #70537518;
    text-align: center;
}

h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.subtitle {
    color: #a08da4;
    font-size: 14px;
    margin-bottom: 28px;
}

.upload {
    display: block;
    padding: 30px 15px;
    border: 2px dashed #dab8e0;
    border-radius: 16px;
    background: #faf7fb;
    cursor: pointer;
    transition: 0.2s;
}

.upload:hover {
    background: #f3eaf5;
    border-color: #705375;
}

.upload-icon {
    font-size: 40px;
    margin-bottom: 10px;
}

input[type="file"] {
    display: none;
}

.filename {
    margin-top: 12px;
    font-size: 13px;
    overflow-wrap: anywhere;
}

label.field-label {
    display: block;
    text-align: left;
    margin: 22px 0 8px;
    font-weight: 600;
}

select {
    width: 100%;
    padding: 13px;
    border: 1px solid #dab8e0;
    border-radius: 10px;
    background: white;
    color: #705375;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    background: #705375;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #896a90;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.progress {
    height: 8px;
    width: 100%;
    margin-top: 22px;
    overflow: hidden;
    border-radius: 20px;
    background: #efebf0;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #b68ac0;
    transition: width 0.2s;
}

.status {
    margin-top: 13px;
    font-size: 13px;
    color: #896a90;
    overflow-wrap: anywhere;
}

.result {
    display: none;
    margin-top: 22px;
    padding: 18px;
    background: #faf7fb;
    border-radius: 14px;
}

audio {
    width: 100%;
    margin-top: 12px;
}

.download {
    display: block;
    margin-top: 14px;
    padding: 13px;
    background: #dab8e0;
    color: #543c59;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
}

.download:hover {
    background: #cda6d6;
}

.note {
    margin-top: 22px;
    color: #a08da4;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Video to Audio ♫</h1>

    <p class="subtitle">
        Extract audio from your video easily ^^
    </p>

    <label class="upload" for="video">
        <div class="upload-icon">♫</div>
        <strong>Choose a video</strong>
        <p style="font-size:13px;color:#a08da4">
            Click here to upload a file
        </p>
        <div class="filename" id="filename">
            No file selected
        </div>
    </label>

    <input
        type="file"
        id="video"
        accept="video/*"
    >

    <label class="field-label" for="format">
        Audio format
    </label>

    <select id="format">
        <option value="mp3">MP3</option>
        <option value="wav">WAV</option>
        <option value="ogg">OGG</option>
        <option value="flac">FLAC</option>
        <option value="aac">AAC</option>
    </select>

    <button id="convert">
        Convert to audio
    </button>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="status" id="status">
        Waiting for a video...
    </div>

    <div class="result" id="result">

        <strong>Conversion completed! ✓</strong>

        <audio id="audio" controls></audio>

        <a class="download" id="download">
            ↓ Download audio
        </a>

    </div>

    <p class="note">
        Your files are processed locally in your browser.
        Nothing is uploaded to a server.
    </p>

</div>

<!-- Local FFmpeg library -->
<script src="./libs/ffmpeg.js"></script>

<script>
const videoInput = document.getElementById("video");
const formatInput = document.getElementById("format");
const convertButton = document.getElementById("convert");

const filename = document.getElementById("filename");
const status = document.getElementById("status");
const progress = document.getElementById("progress");

const result = document.getElementById("result");
const audio = document.getElementById("audio");
const download = document.getElementById("download");

let selectedFile = null;
let ffmpeg = null;
let isLoaded = false;
let audioURL = null;

function setStatus(message) {
    status.textContent = message;
}

function resetResult() {
    result.style.display = "none";

    if (audioURL) {
        URL.revokeObjectURL(audioURL);
        audioURL = null;
    }

    audio.removeAttribute("src");
    download.removeAttribute("href");

    progress.style.width = "0%";
}

videoInput.addEventListener("change", () => {

    selectedFile = videoInput.files[0];

    if (!selectedFile) return;

    filename.textContent = selectedFile.name;

    resetResult();

    setStatus("Video selected! Ready to convert.");

});

async function loadFFmpeg() {

    if (isLoaded) return;

    setStatus("Loading FFmpeg... Please wait.");

    if (!window.FFmpegWASM) {
        throw new Error(
            "FFmpeg library not found. Check the libs folder."
        );
    }

    const { FFmpeg } = window.FFmpegWASM;

    ffmpeg = new FFmpeg();

    ffmpeg.on("progress", ({ progress: value }) => {

        const percent = Math.max(
            0,
            Math.min(100, Math.round(value * 100))
        );

        progress.style.width = percent + "%";

    });

    ffmpeg.on("log", ({ message }) => {
        console.log("[FFmpeg]", message);
    });

    await ffmpeg.load({

        coreURL: new URL(
            "./libs/ffmpeg-core.js",
            window.location.href
        ).href,

        wasmURL: new URL(
            "./libs/ffmpeg-core.wasm",
            window.location.href
        ).href,

        classWorkerURL: new URL(
            "./libs/814.ffmpeg.js",
            window.location.href
        ).href

    });

    isLoaded = true;

}

convertButton.addEventListener("click", async () => {

    if (!selectedFile) {
        setStatus("Please select a video first!");
        return;
    }

    convertButton.disabled = true;
    resetResult();

    let inputName = "input_video";
    let outputName = null;

    try {

        await loadFFmpeg();

        const format = formatInput.value;

        const codecs = {

            mp3: [
                "-c:a", "libmp3lame",
                "-b:a", "192k"
            ],

            wav: [
                "-c:a", "pcm_s16le"
            ],

            ogg: [
                "-c:a", "libvorbis",
                "-q:a", "5"
            ],

            flac: [
                "-c:a", "flac"
            ],

            aac: [
                "-c:a", "aac",
                "-b:a", "192k",
                "-f", "adts"
            ]

        };

        outputName = "output." + format;

        setStatus("Reading video...");

        const fileData = new Uint8Array(
            await selectedFile.arrayBuffer()
        );

        await ffmpeg.writeFile(
            inputName,
            fileData
        );

        setStatus("Extracting audio...");

        const exitCode = await ffmpeg.exec([

            "-i", inputName,
            "-vn",
            "-map", "0:a:0",
            "-sn",
            "-dn",
            ...codecs[format],
            outputName

        ]);

        if (exitCode !== 0) {
            throw new Error(
                "FFmpeg could not convert this video. Check its audio track and format."
            );
        }

        setStatus("Preparing audio file...");

        const data = await ffmpeg.readFile(outputName);

        if (!data || data.length === 0) {
            throw new Error("The output audio file is empty.");
        }

        const mimeTypes = {

            mp3: "audio/mpeg",
            wav: "audio/wav",
            ogg: "audio/ogg",
            flac: "audio/flac",
            aac: "audio/aac"

        };

        const blob = new Blob(
            [data],
            { type: mimeTypes[format] }
        );

        audioURL = URL.createObjectURL(blob);

        audio.src = audioURL;

        const originalName = selectedFile.name.replace(
            /\.[^/.]+$/,
            ""
        );

        download.href = audioURL;
        download.download =
            originalName + "." + format;

        download.textContent =
            "↓ Download " + format.toUpperCase();

        progress.style.width = "100%";

        result.style.display = "block";

        setStatus("Successfully converted! ✓");

    } catch (error) {

        console.error("CONVERSION ERROR:", error);

        setStatus(
            "Error: " +
            (error.message || String(error))
        );

    } finally {

        if (ffmpeg && isLoaded) {

            try {
                await ffmpeg.deleteFile(inputName);
            } catch (e) {}

            if (outputName) {
                try {
                    await ffmpeg.deleteFile(outputName);
                } catch (e) {}
            }

        }

        convertButton.disabled = false;

    }

});

</script>

</body>
</html>
